            <!-- ============================STEERING button and pointer======================== -->
            <div class="your-btn" style="display: flex; flex-direction: row; gap: 30px;">
                <div class="system A">
                    <a (mouseenter)="showOverlay(1)" (mouseleave)="hideOverlayWithDelay()">STEERING</a>
                </div>

                <div class="triangle" *ngIf="activeOverlay === 1"></div>
            </div>

            
            <!-- ============================SUSPENSION button and pointer======================== -->
            <div class="your-btn" style="display: flex; flex-direction: row; gap: 30px;">

                    <a (mouseenter)="showOverlay(2)" (mouseleave)="hideOverlayWithDelay()">SUSPENSION</a>
                </div>

                <div class="triangle" *ngIf="activeOverlay === 2"></div>
            </div>

            
            <!-- ============================CAE button and pointer======================== -->

                <div class="triangle" *ngIf="activeOverlay === 3"></div>
            </div>

                <div class="triangle" *ngIf="activeOverlay === 6"></div>
